# SPDX-License-Identifier: GPL-2.0-only

name: KiloOS Advanced Memory Leak Analysis Suite

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  leak-detection-analysis:
    name: "Enterprise Memory Leak Detection Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Valgrind and Low-Level Analysis Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind build-essential nasm

      - name: Execute Memory Leak Test 1
        run: valgrind --leak-check=full --error-exitcode=1 make test-alloc-1

      - name: Execute Memory Leak Test 2
